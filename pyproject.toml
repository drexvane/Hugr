[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtp"
version = "0.1.0"
description = "Data-to-Insights Platform: messy data to clean data to dashboard to AI query agent"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "pyarrow>=18",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "scipy>=1.14",
    "duckdb>=1.1",
]

[project.optional-dependencies]
# streamlit>=1.51: `st.plotly_chart(width="stretch")` landed there (1.49 for
# `st.dataframe`). `dashboard/app.py` uses both, and on an older Streamlit they
# raise rather than degrade - the old spelling, `use_container_width`, is removed
# after 2025-12-31, so there is no floor that satisfies both.
dashboard = ["plotly>=6.0", "streamlit>=1.51", "Jinja2>=3.1"]
agent = ["anthropic>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
dtp = "dtp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
